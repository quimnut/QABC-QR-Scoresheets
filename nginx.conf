server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # When nginx issues a redirect (e.g. /foo -> /foo/), use a relative
    # Location header instead of an absolute one. This preserves the
    # protocol, host, and port as seen by the client — critical when
    # running behind a load balancer or non-standard port mapping.
    absolute_redirect off;

    # .mjs files must be served as JavaScript (nginx default mime.types omits .mjs)
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve static assets with long cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|pdf|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Astro static pages — try file, then .html, then SPA fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
}
